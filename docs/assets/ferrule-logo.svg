<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">Ferrule</title>
  <desc id="desc">A minimal luminous Möbius band beside the Ferrule wordmark.</desc>

  <defs>
    <linearGradient id="band" x1="25" y1="58" x2="268" y2="182" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="0.38" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="0.82" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#D946EF"/>
    </linearGradient>
    <linearGradient id="twist" x1="105" y1="72" x2="188" y2="168" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CFFAFE"/>
      <stop offset="0.28" stop-color="#22D3EE"/>
      <stop offset="0.66" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="ink" x1="310" y1="70" x2="930" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.52" stop-color="#334155"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <path id="loop" d="M28 120C57 61 96 56 144 117C191 177 228 178 260 120C228 62 191 63 144 123C96 184 57 179 28 120Z"/>
    <path id="over" d="M108 77C121 88 133 103 144 117C157 134 170 151 185 162"/>
    <mask id="underpass" x="0" y="0" width="290" height="240" maskUnits="userSpaceOnUse">
      <rect width="290" height="240" fill="white"/>
      <use href="#over" fill="none" stroke="black" stroke-width="38" stroke-linecap="round"/>
    </mask>

    <path id="wordmark" fill-rule="evenodd" d="
      M310 73H377V94H335V113H372V134H335V167H310Z
      M395 73H465V94H420V111H461V132H420V146H467V167H395Z
      M486 167V73H529C556 73 572 87 572 109C572 124 564 136 550 142L577 167H544L523 144H511V167ZM511 94V124H527C540 124 547 119 547 109C547 99 540 94 527 94Z
      M591 167V73H634C661 73 677 87 677 109C677 124 669 136 655 142L682 167H649L628 144H616V167ZM616 94V124H632C645 124 652 119 652 109C652 99 645 94 632 94Z
      M692 73H717V132C717 143 723 149 735 149C747 149 753 143 753 132V73H778V133C778 156 763 170 735 170C707 170 692 156 692 133Z
      M797 73H822V146H868V167H797Z
      M884 73H954V94H909V111H950V132H909V146H956V167H884Z"/>
  </defs>

  <use href="#loop" fill="none" stroke="url(#band)" stroke-width="31" stroke-linecap="round" stroke-linejoin="round" opacity=".22" filter="url(#soft-glow)"/>
  <g mask="url(#underpass)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <use href="#loop" stroke="#0F172A" stroke-opacity=".2" stroke-width="34"/>
    <use href="#loop" stroke="url(#band)" stroke-width="28"/>
    <use href="#loop" stroke="#FFFFFF" stroke-opacity=".34" stroke-width="2" transform="translate(0 -3)"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <use href="#over" stroke="#0F172A" stroke-opacity=".22" stroke-width="36"/>
    <use href="#over" stroke="url(#twist)" stroke-width="30"/>
    <use href="#over" stroke="#FFFFFF" stroke-opacity=".58" stroke-width="2" transform="translate(-2 -3)"/>
  </g>

  <g stroke-linejoin="round">
    <use href="#wordmark" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="9"/>
    <use href="#wordmark" fill="url(#ink)" stroke="#0F172A" stroke-width="1.5"/>
  </g>
</svg>
