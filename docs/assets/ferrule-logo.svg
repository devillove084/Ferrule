<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-labelledby="title desc">
  <title id="title">Ferrule</title>
  <desc id="desc">A precise wireframe Möbius loop beside the Ferrule wordmark.</desc>

  <style>
    .structure { stroke: #0f172a; }
    .wordmark { fill: #0f172a; }
    @media (prefers-color-scheme: dark) {
      .structure { stroke: #e2e8f0; }
      .wordmark { fill: #e2e8f0; }
    }
  </style>

  <defs>
    <linearGradient id="side-signal" x1="0" y1="52" x2="0" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.42" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="0.58" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accent-rule" x1="309" y1="0" x2="361" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>

    <path id="loop" d="M24 110C57 52 99 52 145 110C191 168 233 168 266 110C233 52 191 52 145 110C99 168 57 168 24 110Z"/>
    <path id="bridge" d="M24 110C57 52 99 52 145 110C191 168 233 168 266 110"/>

    <mask id="underpass" x="0" y="0" width="290" height="220" maskUnits="userSpaceOnUse">
      <rect width="290" height="220" fill="white"/>
      <use href="#bridge" fill="none" stroke="black" stroke-width="28"/>
    </mask>

    <path id="wordmark-path" fill-rule="evenodd" d="
      M309 61H376V82H334V102H371V123H334V159H309Z
      M394 61H464V82H419V100H460V121H419V138H466V159H394Z
      M485 159V61H529C557 61 574 76 574 108C574 124 566 136 552 142L578 159H543L523 143H510V159ZM510 82V123H527C542 123 549 117 549 103C549 89 542 82 527 82Z
      M592 159V61H636C664 61 681 76 681 108C681 124 673 136 659 142L685 159H650L630 143H617V159ZM617 82V123H634C649 123 656 117 656 103C656 89 649 82 634 82Z
      M696 61H721V124C721 136 727 142 739 142C751 142 757 136 757 124V61H782V125C782 149 767 163 739 163C711 163 696 149 696 125Z
      M801 61H826V138H872V159H801Z
      M888 61H958V82H913V100H954V121H913V138H960V159H888Z"/>
  </defs>

  <g fill="none" stroke-linecap="butt" stroke-linejoin="miter">
    <g mask="url(#underpass)">
      <use href="#loop" class="structure" stroke-width="22"/>
      <use href="#loop" stroke="url(#side-signal)" stroke-width="4"/>
      <use href="#loop" stroke="url(#side-signal)" stroke-width="2" transform="translate(0 -7)" opacity=".55"/>
    </g>

    <use href="#bridge" class="structure" stroke-width="22"/>
    <use href="#bridge" stroke="url(#side-signal)" stroke-width="4"/>
    <use href="#bridge" stroke="url(#side-signal)" stroke-width="2" transform="translate(0 -7)" opacity=".55"/>
  </g>

  <circle cx="24" cy="110" r="3.5" fill="#3b82f6"/>
  <circle cx="266" cy="110" r="3.5" fill="#3b82f6"/>

  <use href="#wordmark-path" class="wordmark"/>
  <rect x="309" y="176" width="651" height="1" class="wordmark" opacity=".18"/>
  <rect x="309" y="174" width="52" height="3" fill="url(#accent-rule)"/>
</svg>
