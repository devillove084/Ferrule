[package]
name = "ferrule-composition"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Ferrule built-in model and runtime application composition"
repository = "https://github.com/ferrule/ferrule"

[features]
default = []
cpu-reference = [
    "ferrule-runtime/cpu-reference",
    "ferrule-model/cpu-reference",
    "ferrule-backend/cpu-reference",
]
cuda = [
    "ferrule-runtime/cuda",
    "ferrule-model/cuda",
    "ferrule-backend/cuda",
]

[dependencies]
ferrule-runtime = { version = "0.2.0", path = "../ferrule-runtime", default-features = false }
ferrule-model = { version = "0.2.0", path = "../ferrule-model", default-features = false }
ferrule-backend = { version = "0.2.0", path = "../ferrule-backend", default-features = false }
ferrule-common = { version = "0.2.0", path = "../ferrule-common", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
