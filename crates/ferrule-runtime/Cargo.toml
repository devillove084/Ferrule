[package]
name = "ferrule-runtime"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Ferrule — Rust-native LLM inference runtime"
repository = "https://github.com/ferrule/ferrule"
readme = "../../README.md"
keywords = ["llm", "inference", "moe", "cuda", "rust"]
categories = ["science", "machine-learning"]

[features]
default = []
cpu-reference = ["ferrule-model/cpu-reference"]
cuda = ["ferrule-model/cuda", "dep:ferrule-backend", "ferrule-backend/cuda"]

[dependencies]
ferrule-backend = { version = "0.2.0", path = "../ferrule-backend", optional = true }
ferrule-common = { version = "0.2.0", path = "../ferrule-common" }
ferrule-model = { version = "0.2.0", path = "../ferrule-model" }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
ahash = "0.8"
snafu.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
serde_json = { version = "1", features = ["raw_value"] }
rustls = { version = "0.23.45", default-features = false, features = ["std", "ring"] }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "ring"] }
tempfile = "3"
ferrule-backend = { version = "0.2.0", path = "../ferrule-backend" }

# A test-only executable without libtest's stdout preamble. The production
# library exports child_serve; it contains no fake-worker or hang dispatch.
[[example]]
name = "process_rank_child"
path = "tests/support/process_rank_child.rs"
test = false

# CPU-only network regression child; never a production worker fallback.
[[example]]
name = "network_rank_child"
path = "tests/support/network/test_child.rs"
test = false

[lints]
workspace = true

# Public fake providers require the explicit reference lane.
[[test]]
name = "io_registry"
required-features = ["cpu-reference"]

[[test]]
name = "io_physical"
required-features = ["cpu-reference"]
