[package]
name = "ferrule-common"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Ferrule — shared types, errors, and observability"
repository = "https://github.com/ferrule/ferrule"
readme = "../../README.md"
keywords = ["llm", "inference", "moe", "cuda", "rust"]
categories = ["science", "machine-learning"]

[features]
default = []
# Host-only NVTX3 annotations; also require FERRULE_PROFILE_NVTX=1 at runtime.
nvtx-profile = ["dep:cc"]

[build-dependencies]
cc = { version = "1.2", optional = true }

[dependencies]
atomic-waker = "1"
snafu.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
