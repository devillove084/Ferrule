# LEGACY / NON-EXECUTABLE EXAMPLE
# Historical design sketch only; the Ferrule CLI does not load this TOML file.
# No agent/train/rollout command or runtime configuration parser is provided.
# Fields below do not configure models, logging, or a metrics endpoint.
# See ../docs/ARCHITECTURE.md#observability-and-configuration for supported observability inputs and scope.

[observability]
service_name = "ferrule"
log_level = "info"
log_format = "json"
metrics_enabled = true
metrics_bind = "127.0.0.1:9000"

[model]
backend = "real"
model_id = "./models/SmolLM2-135M-Instruct"
family = "llama"
device = "auto"
chat_template = "plain"
dtype = "f32"
use_flash_attn = false
use_kv_cache = true

[rollout]
max_steps = 8
seed = 42

[train]
dataset_path = "data/math_tiny.jsonl"
num_samples = 8
max_new_tokens = 6
baseline_mode = "leave_one_out"
